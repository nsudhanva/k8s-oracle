apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regcred-sync
  namespace: lakshmi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "nsudhanva",
                "password": "{{ .github_pat }}",
                "email": "nsudhanva@gmail.com",
                "auth": "{{ printf "%s:%s" "nsudhanva" .github_pat | b64enc }}"
              }
            }
          }
  data:
    - secretKey: github_pat
      remoteRef:
        key: github-pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakshmi-secrets-sync
  namespace: lakshmi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: lakshmi-secrets
    creationPolicy: Owner
    template:
      data:
        POSTGRES_DB: "lakshmi"
        POSTGRES_USER: "lakshmi"
        POSTGRES_PASSWORD: "{{ .db_password }}"
        SECRET_KEY: "{{ .django_secret_key }}"
        DATABASE_URL: "postgres://lakshmi:{{ .db_password }}@lakshmi-postgres:5432/lakshmi"
  data:
    - secretKey: db_password
      remoteRef:
        key: lakshmi-db-password
    - secretKey: django_secret_key
      remoteRef:
        key: lakshmi-django-secret-key
