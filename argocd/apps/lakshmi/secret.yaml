apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regcred-sync
  namespace: lakshmi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: regcred
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "nsudhanva",
                "password": "{{ .github_pat }}",
                "email": "nsudhanva@gmail.com",
                "auth": "{{ printf "%s:%s" "nsudhanva" .github_pat | b64enc }}"
              }
            }
          }
  data:
    - secretKey: github_pat
      remoteRef:
        key: github-pat
---
apiVersion: v1
kind: Secret
metadata:
  name: lakshmi-secrets
  namespace: lakshmi
type: Opaque
stringData:
  POSTGRES_DB: lakshmi
  POSTGRES_USER: lakshmi
  POSTGRES_PASSWORD: lakshmi_production_secure_pwd_2026
  SECRET_KEY: django-insecure-prod-lakshmi-k8s-ashburn-arm64-always-free-key
  DATABASE_URL: postgres://lakshmi:lakshmi_production_secure_pwd_2026@lakshmi-postgres:5432/lakshmi
