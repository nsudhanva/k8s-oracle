apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lakshmi-postgres-backup
  namespace: lakshmi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lakshmi-postgres-backup
  namespace: lakshmi
spec:
  # Nightly pg_dump (02:30 UTC). Protects against logical corruption / bad
  # migrations; NOT against zone loss (same region). Keep 7 daily files.
  schedule: "30 2 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: docker.io/library/postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  FILE="/backup/lakshmi-$(date +%F).sql.gz"
                  pg_dump -h lakshmi-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    | gzip > "$FILE"
                  ls -t /backup/lakshmi-*.sql.gz | tail -n +8 | xargs -r rm -f
                  echo "backup written: $FILE"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: lakshmi-secrets
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: lakshmi-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lakshmi-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: lakshmi-postgres-backup
