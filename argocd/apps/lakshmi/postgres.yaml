apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lakshmi-postgres
  namespace: lakshmi
  labels:
    app: lakshmi-postgres
spec:
  serviceName: lakshmi-postgres
  replicas: 1
  selector:
    matchLabels:
      app: lakshmi-postgres
  template:
    metadata:
      labels:
        app: lakshmi-postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lakshmi", "-d", "lakshmi"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lakshmi", "-d", "lakshmi"]
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lakshmi-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lakshmi-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakshmi-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 3Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: oci-bv
        resources:
          requests:
            storage: 40Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lakshmi-postgres
  namespace: lakshmi
  labels:
    app: lakshmi-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: lakshmi-postgres
